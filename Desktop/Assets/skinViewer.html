<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Skin Viewer</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
    </style>
    <script src=" https://cdn.jsdelivr.net/npm/skinview3d@3.4.1/bundles/skinview3d.bundle.min.js "></script>
</head>
<body>
<canvas id="skin_container"></canvas>
<script>
    let skinViewer = new skinview3d.SkinViewer({
        canvas: document.getElementById("skin_container"),
        width: 300,
        height: 400,
        skin: "Images/placeholders/steve_texture.png"
    });

    // Change viewer size
    //skinViewer.width = 600;
    //skinViewer.height = 800;

    // Load another skin
    //skinViewer.loadSkin("img/skin2.png");

    // Load a cape
    skinViewer.loadCape("Images/placeholders/minecon_cape.png");

    // Load an elytra (from a cape texture)
    //skinViewer.loadCape("img/cape.png", { backEquipment: "elytra" });

    // Unload(hide) the cape / elytra
    //skinViewer.loadCape(null);

    // Set the background color
    //skinViewer.background = 0x5a76f3;

    // Set the background to a normal image
    //skinViewer.loadBackground("img/background.png");

    // Set the background to a panoramic image
    //skinViewer.loadPanorama("img/panorama1.png");

    // Change camera FOV
    //skinViewer.fov = 70;

    // Zoom out
    //skinViewer.zoom = 0.5;

    // Rotate the player
    skinViewer.autoRotate = true;

    // Apply an animation
    //skinViewer.animation = new skinview3d.WalkingAnimation();

    // Set the speed of the animation
    //skinViewer.animation.speed = 3;

    // Pause the animation
    //skinViewer.animation.paused = true;

    // Remove the animation
    //skinViewer.animation = null;
</script>
</body>
</html>
